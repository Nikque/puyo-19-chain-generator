; 19連鎖盤面のランダム生成設定
; コメント行は ; または # で始めます。
[Generator]

; この実行で新たに保存したい、重複のない19連鎖盤面の数です。既存の19chain_urls.txt内のURLは数えません。
target_success_count = 5

; 乱数の初期値です。同じ初期値・設定・出力履歴なら同じ探索順になります。
; 生成が進まない場合や別の盤面が欲しい場合は、この値を変更してください。
initial_seed = 20260925

; 使用する通常ぷよの色数です。4または5を指定できます。
; 4色と5色の両方を試し、成功率や好みで選んでください。
color_count = 5

; 各連鎖段階で保持する候補盤面の最大数です。大きくすると探索の幅が広がりますが、
; 処理時間とメモリ使用量も増えます。成功数を増やす際は、まず512から1024などへ増やしてください。
beam_width = 512

; 目標数に届くまでに行う独立探索の最大回数です。1回の探索から保存できる盤面は最大1つです。
; target_success_countより小さいと目標に届きません。上限に達して未達ならURLを残して終了するため、十分大きく設定してください。
restarts = 100

; 各親盤面から次段階へ引き継ぐ候補数です。増やすと探索の選択肢が増えますが、
; 1回あたりの時間とメモリ使用量も増えます。beam_widthと併せて段階的に増やしてください。
candidates_per_parent = 256