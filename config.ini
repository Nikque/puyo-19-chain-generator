; 19連鎖盤面のランダム生成設定
; コメント行は ; または # で始めます。
[Generator]

; 生成する連鎖数。1～19。省略時は19。
target_chain = 19

; この実行で新たに保存したい、重複のない指定連鎖数の盤面の数です。既存の19chain_urls.txt内のURLは数えません。
target_success_count = 100

; 乱数の初期値です。同じ初期値・設定・出力履歴なら同じ探索順になります。
; 生成が進まない場合や別の盤面が欲しい場合は、この値を変更してください。
initial_seed = 20261004

; 使用する通常ぷよの色数です。4または5を指定できます。
; 通常の対戦に合わせて4色。初期設定は有効な出力数/秒と待ち時間を実測して選定。
color_count = 4

; 各連鎖段階で保持する候補盤面の最大数です。大きくすると探索の幅が広がりますが、
; 処理時間とメモリ使用量も増えます。48を初期値とし、複数seedの実測で調整してください。
beam_width = 48

; 目標数に届くまでに行う独立探索の最大回数です。1回の探索から保存できる盤面は最大1つです。
; target_success_countより小さいと目標に届きません。上限に達して未達ならURLを残して終了するため、十分大きく設定してください。
restarts = 1000

; 各親盤面から次段階へ引き継ぐ候補数です。増やすと探索の選択肢が増えますが、
; 1回あたりの時間とメモリ使用量も増えます。成功率だけでなく出力までの時間で比較してください。
candidates_per_parent = 2

; 連鎖の最小個数(4*target_chain)に追加するぷよの範囲。省略時は両方0。
; 0 <= min_extra_puyos <= max_extra_puyos <= 78 - 4*target_chain。
; 19連鎖: 0～2、18連鎖: 0～6。範囲内をランダムに探索します。
; 77個のみを探索する場合: target_chain=19、min=max=1。
; 奇数個は準備段階で6個を使って5個消し、1個残してから構築します。
; 最終連鎖の各波は常に単独4個消し。14段目への固定は行いません。
min_extra_puyos = 0
max_extra_puyos = 0
